name: Bug 报告
description: 某个功能没有按文档工作
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        谢谢！请不要附上视频或任何隐私内容。安全问题请改用 Security 页（"Report a vulnerability"）私下报告。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 命令与输出
      description: 你运行的 vidroute 命令及其 `--json` 输出（请删掉你认为涉及隐私的路径）。
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`vidroute doctor --json` 的输出"
      render: json
  - type: input
    id: host
    attributes:
      label: Agent 宿主与 LLM（如相关）
      placeholder: claude-code + claude-opus-5-5

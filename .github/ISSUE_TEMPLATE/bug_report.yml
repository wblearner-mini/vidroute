name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please never attach the video or anything private. For security issues use the
        Security tab ("Report a vulnerability") instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The vidroute command you ran and its `--json` output (remove paths you consider private).
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`vidroute doctor --json` output"
      render: json
  - type: input
    id: host
    attributes:
      label: Agent host and LLM (if relevant)
      placeholder: claude-code + claude-opus-5-5

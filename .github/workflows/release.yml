name: Release

# Runs when a version tag (v*) is pushed. Builds the sdist and wheel, writes SHA256SUMS.txt and
# creates a GitHub release with them (marked pre-release for a/b/rc/dev versions). PyPI publishing
# is a separate, manual step (workflow_dispatch with publish_to_pypi=true) using trusted publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Upload the built distributions to PyPI (trusted publishing must be configured)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m build --no-isolation
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/vidroute/__init__.py').read()).group(1))")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $VERSION"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Release copies of the installers default to this release's wheel, so the README can point at
      # releases/latest/download/install.sh (and install.ps1) without naming a version.
      - name: Installers pinned to this release
        run: |
          WHEEL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/vidroute-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          test -f "dist/vidroute-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          MAIN="https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/main.tar.gz"
          for f in install.sh install.ps1; do
            sed "s#${MAIN}#${WHEEL}#" "$f" > "dist/$f"
            grep -qF "$WHEEL" "dist/$f" || { echo "$f: default source not replaced"; exit 1; }
          done
          cd dist && sha256sum * | grep -v ' SHA256SUMS.txt$' > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *a*|*b*|*rc*|*dev*) PRE="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Verify downloads with SHA256SUMS.txt." $PRE

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

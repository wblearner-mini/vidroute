name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target; it must stay green.
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Windows, pinned)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --version 9.0.2 -y --no-progress
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install locked dev dependencies and vidroute
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          vidroute --version
          vidroute version --json
          python -m vidroute version --json

      - name: doctor returns within 10 seconds
        shell: bash
        run: |
          python - <<'EOF'
          import json, subprocess, time
          t = time.monotonic()
          out = subprocess.run(["vidroute", "doctor", "--refresh", "--json"], capture_output=True, text=True, check=True).stdout
          elapsed = time.monotonic() - t
          d = json.loads(out)["data"]
          print(json.dumps({k: d[k] for k in ("os", "cpu", "ram_gb", "gpus", "gpu_probe", "tier", "capabilities", "probe_seconds")}, indent=1))
          print(f"wall time: {elapsed:.2f}s")
          assert elapsed < 10, elapsed
          EOF

  package:
    name: build and install wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m build --no-isolation
      - name: Install the wheel into a clean venv and run it
        shell: bash
        run: |
          python -m venv /tmp/clean-venv || python -m venv "$RUNNER_TEMP/clean-venv"
          VENV=$( [ -d /tmp/clean-venv ] && echo /tmp/clean-venv || echo "$RUNNER_TEMP/clean-venv" )
          if [ -x "$VENV/Scripts/python.exe" ]; then PY="$VENV/Scripts/python.exe"; else PY="$VENV/bin/python"; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m vidroute version --json
          "$PY" -c "import vidroute.core.resources as r; print(r.data_file('routing/llm-profiles.yaml'))"
          "$PY" -m vidroute doctor --offline --json > doctor.json
          SKILL_DIR=$("$PY" -m vidroute skill path)
          test -f "$SKILL_DIR/SKILL.md"
          "$PY" "$SKILL_DIR/scripts/vidroute.py" version --json
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | "$PY" -m vidroute.mcp_server | grep -q '"serverInfo"'
      - name: Checksums
        shell: bash
        run: |
          cd dist && sha256sum * | tee SHA256SUMS.txt

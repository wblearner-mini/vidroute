# Local model manifest. Nothing here is downloaded until the user confirms an
# install plan (`vidroute install --plan` / `--yes`).
#
# Hard rules (see docs/DECISIONS.md, "Model manifest"):
#   * No invented URLs or hashes. Every sha256 below was computed from the
#     official file on the recorded date or taken from the publisher's own
#     digest (GitHub release asset digest, Hugging Face LFS oid, ModelScope
#     file API, RapidOCR default_models.yaml) and cross-checked.
#   * Downloads are only allowed from `allowed_domains` (suffix match, redirects
#     included); a sha256 mismatch is a hard failure.
#   * Restricted licenses (gated / non-commercial / copyleft) never enter the
#     default path and require `--accept-license <id>`.
#   * Every capability keeps at least one CPU-only, no-compile, Windows-ready path.
#
# `files` describes the installed layout (relative to the model directory).
# A `source` either downloads those files one by one (`kind: files`, all
# mirrors must serve identical bytes) or downloads one archive (`kind:
# archive`, verified by its own sha256) and extracts `files` from it.
schema: "vidroute/manifest/1"

allowed_domains:
  - github.com
  - githubusercontent.com
  - huggingface.co
  - hf.co
  - hf-mirror.com
  - modelscope.cn

# Isolated worker environments created with uv (or venv+pip as a fallback).
# `lock` files are hash-pinned requirement sets generated by
# `uv pip compile --universal --generate-hashes` (see envs/README.md).
env_groups:
  sherpa:
    description: "sherpa-onnx runtime for VAD and ASR (CPU, prebuilt wheels incl. Windows x64)"
    python: "3.12"
    lock: envs/sherpa.lock.txt
    import_check: "import sherpa_onnx, numpy"
    approx_size_mb: 60
  ocr:
    description: "RapidOCR + onnxruntime for PP-OCR models (CPU, prebuilt wheels)"
    python: "3.12"
    lock: envs/ocr.lock.txt
    import_check: "import rapidocr, onnxruntime, numpy"
    approx_size_mb: 160
    # No win_arm64 wheels for opencv-python-headless 5.0.0.93 and pyclipper 1.4.0
    # (PyPI, 2026-10-23): Windows on Arm runs this env with x64 Python (emulated).
    windows_arm64_arch: x86_64
  whisper:
    description: "faster-whisper (CTranslate2); add the CUDA 12 + cuDNN 9 wheels on NVIDIA GPUs"
    python: "3.12"
    lock: envs/whisper.lock.txt
    lock_cuda: envs/whisper-cuda.lock.txt
    import_check: "import faster_whisper, ctranslate2"
    approx_size_mb: 250
    approx_size_mb_cuda: 1400
    # No win_arm64 wheel for ctranslate2 4.8.3 (PyPI, 2026-10-23).
    windows_arm64_arch: x86_64

# Portable tools vidroute can put into $VIDROUTE_HOME/runtimes when the system
# has none — only as part of a confirmed install plan, never added to PATH
# (vidroute looks there itself). Same rules as models: the archive and every
# extracted file are pinned by sha256 and come from allow-listed domains.
runtimes:
  - id: ffmpeg-windows
    tool: ffmpeg
    version: "9.0.2"
    # Windows on Arm runs the x64 build under emulation.
    platforms: [windows-x86_64, windows-arm64]
    install_dir: ffmpeg
    size_mb: 109.5
    license:
      spdx: GPL-3.0-or-later
      restricted: false
      gated: false
      name: "FFmpeg 9.0.2 essentials build by gyan.dev (static; libx264, libmp3lame, freetype)"
      url: "https://www.gyan.dev/ffmpeg/builds/"
      notes: "GPLv3 build of FFmpeg commit 946fcce07b. Copyleft applies to redistribution, not to use; vidroute runs it as a separate program."
    files:
      - path: bin/ffmpeg.exe
        size: 105423872
        sha256: 3256173f3f8bffd7df12227c68adf68025edb1832273a9530688a7bb1ed8edec
      - path: bin/ffprobe.exe
        size: 105221120
        sha256: f0d36ecbbdd3bcfac3efa078c96c7271c2e68b3810595552ac3b7f17e9a65c52
      - path: LICENSE
        size: 35147
        sha256: 8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903
    sources:
      - type: github
        kind: archive
        url: "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip"
        size: 114768076
        sha256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        strip_prefix: "ffmpeg-9.0.2-essentials_build/"
    verified_at: "2026-10-23"
    notes: "Archive sha256 equals the GitHub release asset digest and a local download; file hashes computed from that download."


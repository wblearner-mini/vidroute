# Agent host profiles: what the agent shell can actually hand to its model.
#
# "The model supports video" is not enough: many hosts can only attach images.
# Effective capabilities = LLM profile ∩ host profile.
#
# video_delivery:
#   native         the host sends the video file itself (audio track included
#                  when video_includes_audio is true)
#   frame-sampled  the host (or its model server) turns video into frames first;
#                  treated exactly like "no video" (vidroute samples frames itself)
#   preprocessed   the host converts media to text with its own pipeline
#                  (D5-like); treated as "no video" for the current LLM
#   none           videos cannot be attached
#
# confidence:
#   verified         behaviour observed live on the stated date
#   source-verified  behaviour read from the host's source code at the stated release
#   docs-only        taken from official documentation, not tested
#   unverified       no first-party evidence; conservative assumptions apply
#
# Unknown hosts fall back to `unknown`. Override with `vidroute host set`.
schema: "vidroute/host-profiles/1"

hosts:
  - id: claude-code
    aliases: [claude, claude-desktop, claude-code-cli]
    can_read_files: true
    can_attach_image: true
    can_attach_video: false
    can_attach_audio: false
    video_delivery: none
    video_includes_audio: false
    delivery: inline
    image_formats: [png, jpeg, gif, webp]
    max_attachment_mb: 128
    max_images_per_turn: null
    shell: true
    confidence: verified
    verified_at: "2026-10-21"
    source:
      - "https://code.claude.com/docs/en/tools-reference.md"
    notes: >-
      Read returns PNG/JPEG/GIF/WebP as images (resized to the model's limits;
      >128 MB refused). Live test 2026-10-21: an .mp4 and an .mp3 were both
      refused as binary files. Videos therefore go through D3 (keyframes +
      local transcript).

  - id: codex-cli
    aliases: [codex, openai-codex]
    can_read_files: true
    can_attach_image: true
    can_attach_video: false
    can_attach_audio: true
    video_delivery: none
    video_includes_audio: false
    delivery: inline
    image_formats: [png, jpeg, gif, webp]
    max_attachment_mb: 50
    max_images_per_turn: null
    shell: true
    confidence: source-verified
    verified_at: "2026-10-21"
    source:
      - "https://github.com/openai/codex/blob/rust-v0.163.0/codex-rs/protocol/src/local_media.rs"
    notes: >-
      rust-v0.163.0 snapshots local images and local audio (wav/mp3/m4a, up to
      50 MB, the Responses API audio limit) into data URLs; there is no video
      input type. Audio only helps when the selected model accepts audio.

  - id: gemini-cli
    aliases: [gemini]
    can_read_files: true
    can_attach_image: true
    can_attach_video: true
    can_attach_audio: true
    video_delivery: native
    video_includes_audio: true
    delivery: inline
    image_formats: [png, jpeg, gif, webp, heic, heif]
    max_attachment_mb: 20
    max_images_per_turn: null
    shell: true
    confidence: source-verified
    verified_at: "2026-10-21"
    source:
      - "https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/utils/fileUtils.ts"
      - "https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/utils/constants.ts"
    notes: >-
      v0.65.0: detectFileType() classifies video/* files and
      processSingleFileContent() returns them as inlineData parts (the whole
      file, audio included); MAX_FILE_SIZE_MB = 20. The read_file docs still list
      only text/images/audio/PDF, so the docs lag the code. Not yet tested live
      (needs a Gemini API key) — see KNOWN_ISSUES.md.

  - id: qwen-code
    aliases: [qwen, qwen-code-cli]
    can_read_files: true
    can_attach_image: true
    can_attach_video: true
    can_attach_audio: true
    video_delivery: native
    video_includes_audio: true
    delivery: inline
    image_formats: [png, jpeg, gif, webp, bmp]
    max_attachment_mb: 7.4
    max_images_per_turn: null
    shell: true
    confidence: source-verified
    verified_at: "2026-10-21"
    source:
      - "https://github.com/QwenLM/qwen-code/blob/main/packages/core/src/utils/fileUtils.ts"
    notes: >-
      Video/audio files are sent inline only when the configured model declares
      the modality (`modalities.video` / `modalities.audio`); the base64 data URI
      must stay under 10 MB (about 7.4 MB of raw file). An experimental Omni mode
      uploads up to 1 GiB through DashScope instead. If your model config does
      not declare video, run `vidroute host set qwen-code --video-delivery none`.

  - id: opencode
    aliases: [open-code, sst-opencode]
    can_read_files: true
    can_attach_image: true
    can_attach_video: false
    can_attach_audio: false
    video_delivery: none
    video_includes_audio: false
    delivery: inline
    image_formats: [png, jpeg, gif, webp]
    max_attachment_mb: 20
    max_images_per_turn: null
    shell: true
    confidence: docs-only
    verified_at: "2026-10-21"
    source:
      - "https://github.com/anomalyco/opencode/blob/dev/services/www/src/docs/content/attachments.mdx"
    notes: >-
      V2 sessions make only text files, directory listings and PNG/JPEG/GIF/WebP
      images visible to the model; PDF, audio and video attachments are dropped.
      Attachments over 20 MiB are rejected.


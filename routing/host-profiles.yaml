      - "https://cursor.com/help/customization/context.md"
    notes: "Closed source; only image attachments have been observed. Conservative assumptions."

  - id: openclaw
    aliases: [open-claw]
    can_read_files: true
    can_attach_image: true
    can_attach_video: false
    can_attach_audio: false
    video_delivery: preprocessed
    video_includes_audio: false
    delivery: inline
    image_formats: [png, jpeg, gif, webp]
    max_attachment_mb: 50
    max_images_per_turn: null
    shell: true
    confidence: docs-only
    verified_at: "2026-10-21"
    source:
      - "https://docs.openclaw.ai/nodes/media-understanding"
    notes: >-
      Inbound media is summarized to text by a media-understanding model before
      the reply model runs (defaults: 10 MB image, 20 MB audio, 50 MB video), a
      D5-style preprocessing step. Chat Completions reply models configured with
      input ["text","image","video"] can receive local video directly via
      video_url parts; if yours is set up that way, run
      `vidroute host set openclaw --video-delivery native --attach-video yes`.

  - id: local-mistralrs
    aliases: [mistralrs, mistral.rs]
    can_read_files: true
    can_attach_image: true
    can_attach_video: true
    can_attach_audio: false
    video_delivery: frame-sampled
    video_includes_audio: false
    delivery: inline
    image_formats: [png, jpeg, gif, webp]
    max_attachment_mb: null
    max_images_per_turn: null
    shell: false
    confidence: docs-only
    verified_at: "2026-10-21"
    source:
      - "https://github.com/EricLBuehler/mistral.rs/blob/master/docs/src/content/docs/guides/models/video-setup.md"
    notes: >-
      mistral.rs decodes non-GIF video into frames with FFmpeg at request time;
      whether audio is used depends on the loaded model. Frame-sampled delivery
      is routed like images (D3), where vidroute controls the sampling.


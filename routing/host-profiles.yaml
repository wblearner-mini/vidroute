    notes: "Image attachments only; a code search of src/ on 2026-10-21 found no video handling."

  - id: roo
    aliases: [roo-code, roocode]
    can_read_files: true
    can_attach_image: true
    can_attach_video: false
    can_attach_audio: false
    video_delivery: none
    video_includes_audio: false
    delivery: inline
    image_formats: [png, jpeg, webp]
    max_attachment_mb: null
    max_images_per_turn: null
    shell: true

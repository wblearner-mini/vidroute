# 确定性两层路由器的阈值（src/vidroute/core/plan）。
# 这里的每个值都可以由用户通过配置覆盖；代码从不让 LLM 做路由决定。
# 设计理由见 references/routing.md。
schema: "vidroute/rules/1"

delivery:
  # D1（native-av）：视频长于此值、需要分段，或任务需要带时间戳的逐字文本
  # （minutes、transcript）时，附上本地转写作为参考/锚点。
  native_only_max_minutes: 10
  transcript_tasks: [minutes, transcript]
  # 原生路线最多把超过限额的视频切成这么多段。
  max_segments: 8
  segment_overlap_seconds: 3
  # 输入 token 预算 = 上下文窗口 * budget_fraction（配置：budget_fraction 或 budget_tokens）。
  # 超出预算：降级（prefer=cost）或询问（其他）。
  budget_fraction: 0.5
  over_budget_action:
    quality: confirm
    privacy: confirm
    cost: degrade
  transcode:
    target_heights: [720, 540, 480, 360]
    max_fps: 10
    min_fps: 2
    audio_kbps: 64
    min_audio_kbps: 24
    min_video_kbps: 120
    size_safety: 0.9
    video_codec: libx264
    audio_codec: aac
    crf: 28
  # "帧 + 音轨"（LLM ∩ 宿主接受音频时使用的 D3 变体）：
  # 音频按这一码率阶梯重新编码为 16 kHz 单声道 MP3，直到满足限额。
  audio_attachment:
    enabled: true
    sample_rate: 16000
    mp3_kbps_ladder: [64, 48, 40, 32, 24, 16]

frames:
  max_frames: 60
  base_interval_seconds: 4
  min_interval_seconds: 2
  max_interval_seconds: 30
  # 在屏幕上停留至少这么久、却被关键帧预算漏掉的镜头会被报告
  # （警告 + omitted-shots.md），以免有人把这些帧当作完整内容。
  omitted_min_seconds: 5
  # 关键帧选择最多分析这么多张候选小缩略图（视频自身的关键帧足够密时用它们，
  # 否则均匀解码一个每秒最多 4 帧的网格）；见 core/prepare/keyframes.py。
  max_candidates: 360
  # 候选帧 64 px 灰度缩略图的任一 4x4 分块与上一个候选帧（或本镜头第一帧）的
  # 平均绝对差超过此值（0-255）时，开始一个新镜头。压缩噪声远低于此值；
  # 幻灯片新增一行文字或镜头切换则远高于此值。
  change_threshold: 10
  frame_max_side_px: 1280
  ocr_frame_max_side_px: 1920
  jpeg_qscale: 3
  contact_sheet:
    cols: 4
    rows: 3
    tile_width: 400
    label: true

local:
  embedded_subtitle_min_coverage: 0.7
  speech_ratio_skip_asr: 0.05
  ocr_text_density_threshold: 0.3
  long_video_minutes: 30
  asr_chunk_max_seconds: 25
  vad_min_silence_seconds: 0.4
  vad_min_speech_seconds: 0.25
  language_probe_seconds: 30
  # R3：使用 "zh" 选择器的语言；其他语言都用 "multi"。
  zh_languages: [zh, yue, cmn, zh-cn, zh-tw, zh-hk, zh-hans, zh-hant]
  # 每个选择器和档位的 ASR 偏好顺序。第一个已安装、支持该语言并通过冒烟测试的条目胜出；
  # 失败时沿列表往下回退（GPU -> CPU、大模型 -> 小模型、引擎 A -> B）。
  asr_chains:
    zh:
      gpu-cuda: [asr-sensevoice-small-int8, asr-faster-whisper-large-v3-turbo, asr-whisper-small-int8]
      gpu-vulkan: [asr-sensevoice-small-int8, asr-whisper-small-int8]
      cpu-full: [asr-sensevoice-small-int8, asr-sensevoice-yue-int8, asr-whisper-small-int8]
      cpu-lite: [asr-sensevoice-small-int8, asr-whisper-small-int8]
    multi:
      gpu-cuda: [asr-faster-whisper-large-v3-turbo, asr-whisper-small-int8, asr-sensevoice-small-int8]
      gpu-vulkan: [asr-whisper-small-int8, asr-sensevoice-small-int8]
      cpu-full: [asr-whisper-small-int8, asr-faster-whisper-small, asr-sensevoice-small-int8]
      cpu-lite: [asr-whisper-small-int8, asr-sensevoice-small-int8]
  ocr_chain: [ocr-ppocrv6-small, ocr-ppocrv6-tiny]
  vad_chain: [vad-silero, vad-energy]
  scene_chain: [scene-ffmpeg]

# 粗略的计划估算（见 references/routing.md）；只影响 plan.json 中的
# est_seconds / est_input_tokens，从不影响结果正确性。
estimates:
  transcript_tokens_per_speech_second: 3.5
  ocr_tokens_per_frame: 120
  diarize_rtf: 0.1
  timeline_overhead_tokens: 800
  asr_rtf:
    cpu-lite: 0.25
    cpu-full: 0.08
    gpu-cuda: 0.03
    gpu-vulkan: 0.08
  # 实测：在 8 核台式机上，1080p 录屏帧（界面文字密集）每帧约 1.2 秒；
  # 幻灯片更快。OCR 总是在 CPU 上运行。
  ocr_seconds_per_frame:
    cpu-lite: 3.0
    cpu-full: 1.2
    gpu-cuda: 1.2
    gpu-vulkan: 1.2
  transcode_rtf: 0.2
  frame_extract_seconds: 0.12

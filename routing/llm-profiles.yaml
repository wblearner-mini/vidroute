# LLM capability profiles: input modalities + per-request limits only.
#
# * `id` / `aliases` are fnmatch-style globs matched case-insensitively against
#   the model id the agent reports (`vidroute llm resolve --llm <id>`), with and
#   without any `provider/` prefix. The most specific match wins; `*` is last.
# * Values must come from official documentation and carry `verified_at` +
#   `evidence`. Anything that could not be verified is marked
#   `unverified: true` and uses conservative values.
# * Users override entries with `vidroute llm set <id> ...`; overrides win.
# * Contributing: see docs/PROFILE_CONTRIBUTING.md (official URL + date required).
#
# Size fields are megabytes of the *raw file*. When a provider limit applies to
# the base64 string, the entry says `inline_is_base64: true` and vidroute
# budgets for the ~4/3 base64 expansion.
schema: "vidroute/llm-profiles/1"


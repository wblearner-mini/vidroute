    notes: >-
      Static mode samples 1 FPS: 66 tokens/frame at low media resolution (the
      default) or 258 otherwise, plus 32 tokens/s of audio: ~100 tokens/s by
      default, ~300 at high resolution. 1M-context models take up to 3 h of video
      at low resolution (1 h at high). Inline data is limited to 100 MB per
      request (the file-input-methods table, 2026-11-12; the video page still
      says 20 MB in one paragraph); the File API takes 2 GB per file. Covers the
      Gemini 3.x and Gemini 4 (gemini-4-carbon, gemini-4-argon) chat models.
      Image-generation, TTS and Live models share the prefix but are not chat
      models.
    unverified_fields: [audio.max_seconds, image.max_images]

